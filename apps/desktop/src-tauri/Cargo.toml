[package]
name = "githelm-desktop"
version = "0.1.0"
description = "Githelm — Tauri 2 + React 19 desktop client"
authors = ["Githelm contributors"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77"

[lib]
name = "githelm_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-os = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "macros"] }
keyring = "3"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
# SQLite persistence for projects/deployments/servers/logs/issues under ~/.githelm/.
# "bundled" compiles SQLite in so no system library is required at runtime.
rusqlite = { version = "0.37", features = ["bundled"] }
dirs = "6"
# GitHub REST client for the "import from GitHub" flow. Runs on the Rust side
# so the renderer CSP can stay closed to the network.
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }

# NSWindow layer corner radius for the borderless macOS window.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
