name: Release Trigger

# push v* 标签后 dispatch release.yml 启动自动打包发布。
# release.yml 本身只允许 workflow_dispatch（含手动单平台修复），因此必须由本工作流桥接 tag。

on:
  push:
    tags:
      - "v*"

permissions:
  actions: write
  contents: read

concurrency:
  group: release-trigger-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  dispatch:
    name: Start release build
    runs-on: ubuntu-latest

    steps:
      - name: Dispatch release workflow
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Githelm 默认分支为 main；--ref 必须与 release.yml 所在的存活分支一致。
          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f tag="$RELEASE_TAG" \
            -f platform=all