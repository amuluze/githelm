name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Quality gate
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Rust toolchain (rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Run npm run check (typecheck + cargo check)
        run: pnpm check

      - name: Run workspace tests (vitest)
        run: pnpm test

      - name: Run ESLint
        run: pnpm lint

      - name: Run cargo clippy (-D warnings)
        run: pnpm lint:rust

      - name: Cross-target cargo check (aarch64 + x86_64)
        run: |
          pnpm --filter @githelm/desktop exec cargo check --manifest-path src-tauri/Cargo.toml --locked --target aarch64-apple-darwin
          pnpm --filter @githelm/desktop exec cargo check --manifest-path src-tauri/Cargo.toml --locked --target x86_64-apple-darwin

# 发布链路（tag 驱动的自动打包发布）已迁移到 .github/workflows/release.yml
# （由 release-trigger.yml 在 push v* tag 时 dispatch）。本文件只负责
# PR 与 push main 的质量门禁。
